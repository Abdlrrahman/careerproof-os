<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#appleBg)" />

  <!-- Shield / Hexagon Outer Track -->
  <path d="M90 28 L145 56 V112 L90 156 L35 112 V56 Z" 
        fill="none" 
        stroke="url(#appleGrad)" 
        stroke-width="6.5" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#appleGlow)" />

  <!-- Inner Architectural Core Nodes & Circuit Paths -->
  <circle cx="90" cy="85" r="10" fill="#38BDF8" />
  <circle cx="62" cy="68" r="6.5" fill="#10B981" />
  <circle cx="118" cy="68" r="6.5" fill="#10B981" />
  <circle cx="90" cy="122" r="7.5" fill="#34D399" />

  <line x1="62" y1="68" x2="90" y2="85" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="118" y1="68" x2="90" y2="85" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="90" y1="85" x2="90" y2="122" stroke="#10B981" stroke-width="5" stroke-linecap="round" />

  <!-- Verified Proof Checkmark Badge -->
  <path d="M76 85 L87 96 L107 71" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
