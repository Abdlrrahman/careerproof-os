<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Shield / Hexagon Outer Track -->
  <path d="M64 18 L104 38 V78 L64 110 L24 78 V38 Z" 
        fill="none" 
        stroke="url(#cyanEmerald)" 
        stroke-width="4.5" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Inner Architectural Core Nodes & Circuit Paths -->
  <circle cx="64" cy="60" r="7" fill="#38BDF8" />
  <circle cx="44" cy="48" r="4.5" fill="#10B981" />
  <circle cx="84" cy="48" r="4.5" fill="#10B981" />
  <circle cx="64" cy="86" r="5" fill="#34D399" />

  <line x1="44" y1="48" x2="64" y2="60" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="84" y1="48" x2="64" y2="60" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="60" x2="64" y2="86" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />

  <!-- Verified Proof Checkmark Badge -->
  <path d="M54 60 L62 68 L76 50" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
